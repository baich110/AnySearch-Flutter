name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android platform files
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=anysearch

      - name: Inject INTERNET permission into AndroidManifest
        run: |
          python3 - << 'PY'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              c = f.read()
          perms = '    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
          if 'android.permission.INTERNET' not in c:
              c = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, c, count=1)
          with open(path, 'w') as f:
              f.write(c)
          print('=== 注入后 manifest ===')
          print(open(path).read())
          PY

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks || true

      - name: Add signing config to build.gradle.kts
        run: |
          cat > /tmp/signing_patch.py << 'PY'
          import re
          with open('android/app/build.gradle.kts','r') as f:
              c = f.read()
          # Add keystore properties at top
          c = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n' + c
          # Add signingConfigs inside android block
          c = c.replace(
              '    buildTypes {',
              '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String?\n            keyPassword = keystoreProperties["keyPassword"] as String?\n            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n            storePassword = keystoreProperties["storePassword"] as String?\n        }\n    }\n\n    buildTypes {'
          )
          c = c.replace(
              '            signingConfig = signingConfigs.getByName("debug")',
              '            signingConfig = signingConfigs.getByName("release")'
          )
          with open('android/app/build.gradle.kts','w') as f:
              f.write(c)
          PY
          python3 /tmp/signing_patch.py

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        continue-on-error: true

      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter config --enable-windows-desktop
      - name: Regenerate Windows platform files
        shell: bash
        run: |
          rm -rf windows
          flutter create . --platforms=windows --project-name=anysearch
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Archive Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath anysearch-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: anysearch-windows.zip

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Prepare Web platform files (保留无障碍增强的 index.html)
        shell: bash
        run: |
          # 备份仓库内定制的无障碍 index.html，flutter create 生成模板后恢复，
          # 避免默认模板覆盖 lang/加载提示/aria-live 等增强
          cp web/index.html /tmp/anysearch-index.html
          rm -rf web
          flutter create . --platforms=web --project-name=anysearch
          cp /tmp/anysearch-index.html web/index.html
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=anysearch --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
