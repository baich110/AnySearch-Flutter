name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android platform files
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=anysearch

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks || true

      - name: Add signing config to build.gradle.kts
        run: |
          cat > /tmp/signing_patch.py << 'PY'
          import re
          with open('android/app/build.gradle.kts','r') as f:
              c = f.read()
          # Add keystore properties at top
          c = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n' + c
          # Add signingConfigs inside android block
          c = c.replace(
              '    buildTypes {',
              '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String?\n            keyPassword = keystoreProperties["keyPassword"] as String?\n            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n            storePassword = keystoreProperties["storePassword"] as String?\n        }\n    }\n\n    buildTypes {'
          )
          c = c.replace(
              '            signingConfig = signingConfigs.getByName("debug")',
              '            signingConfig = signingConfigs.getByName("release")'
          )
          with open('android/app/build.gradle.kts','w') as f:
              f.write(c)
          PY
          python3 /tmp/signing_patch.py

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        continue-on-error: true

      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter config --enable-windows-desktop
      - name: Regenerate Windows platform files
        shell: bash
        run: |
          rm -rf windows
          flutter create . --platforms=windows --project-name=anysearch
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Archive Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath anysearch-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: anysearch-windows.zip

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Regenerate Web platform files
        run: |
          rm -rf web
          flutter create . --platforms=web --project-name=anysearch
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
